<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A calm, focused Pomodoro timer with tasks, progress ring, and session tracking." />
  <title>Pomodoro Focus</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">Focus</h1>
      <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <main class="main">
      <section class="timer-section">
        <div class="mode-tabs" role="tablist">
          <button class="mode-tab active" data-mode="work" role="tab" aria-selected="true">Work</button>
          <button class="mode-tab" data-mode="shortBreak" role="tab" aria-selected="false">Short Break</button>
          <button class="mode-tab" data-mode="longBreak" role="tab" aria-selected="false">Long Break</button>
        </div>

        <div class="ring-container">
          <svg class="progress-ring" width="280" height="280" viewBox="0 0 280 280">
            <circle class="ring-bg" cx="140" cy="140" r="124" />
            <circle class="ring-progress" cx="140" cy="140" r="124" />
          </svg>
          <div class="time-display">
            <span id="time" class="time">25:00</span>
            <span id="mode-label" class="mode-label">Focus time</span>
          </div>
        </div>

        <div class="controls">
          <button id="reset-btn" class="ctrl-btn secondary" aria-label="Reset" title="Reset">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
          <button id="start-btn" class="ctrl-btn primary" aria-label="Start">
            <svg id="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="pause-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" hidden>
              <rect x="6" y="4" width="4" height="16"/>
              <rect x="14" y="4" width="4" height="16"/>
            </svg>
          </button>
          <button id="skip-btn" class="ctrl-btn secondary" aria-label="Skip" title="Skip to next">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 4 15 12 5 20 5 4"/>
              <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
          </button>
        </div>

        <div class="session-info">
          <span class="session-count">
            <span id="completed-count">0</span> / <span id="target-count">4</span> sessions
          </span>
          <div class="session-dots" id="session-dots" aria-hidden="true"></div>
        </div>
      </section>

      <section class="tasks-section">
        <div class="tasks-header">
          <h2>Session Tasks</h2>
          <span id="task-progress" class="task-progress">0/0</span>
        </div>
        <form id="task-form" class="task-form">
          <input type="text" id="task-input" placeholder="Add a task for this session…" maxlength="120" autocomplete="off" />
          <button type="submit" class="add-btn" aria-label="Add task">+</button>
        </form>
        <ul id="task-list" class="task-list"></ul>
        <p id="empty-tasks" class="empty-tasks">No tasks yet. Add one to stay focused.</p>
      </section>
    </main>
  </div>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-content" role="dialog" aria-labelledby="settings-title">
      <div class="modal-header">
        <h2 id="settings-title">Settings</h2>
        <button id="close-settings" class="icon-btn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label for="work-min">Work length (min)</label>
          <input type="number" id="work-min" min="1" max="90" value="25" />
        </div>
        <div class="setting-group">
          <label for="short-min">Short break (min)</label>
          <input type="number" id="short-min" min="1" max="30" value="5" />
        </div>
        <div class="setting-group">
          <label for="long-min">Long break (min)</label>
          <input type="number" id="long-min" min="1" max="60" value="15" />
        </div>
        <div class="setting-group">
          <label for="sessions-until-long">Sessions until long break</label>
          <input type="number" id="sessions-until-long" min="1" max="10" value="4" />
        </div>
        <div class="setting-group toggle-group">
          <label for="sound-toggle">Sound on complete</label>
          <button id="sound-toggle" class="toggle" role="switch" aria-checked="true" data-on="true">
            <span class="toggle-knob"></span>
          </button>
        </div>
        <div class="setting-group toggle-group">
          <label for="auto-start-toggle">Auto-start next phase</label>
          <button id="auto-start-toggle" class="toggle" role="switch" aria-checked="false" data-on="false">
            <span class="toggle-knob"></span>
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button id="save-settings" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
